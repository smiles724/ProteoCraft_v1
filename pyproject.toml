[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "proteocraft"
version = "1.0.0"
description = "ESMFold2 protein binder design with gradient-guided two-stage MCTS"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
  "torch>=2.7",
  "numpy>=1.26",
  "PyYAML>=6",
  "biopython>=1.85",
]

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1", "ruff>=0.11"]

[project.scripts]
proteocraft = "proteocraft.cli:main"
proteocraft-rescore = "proteocraft.evaluation.cli:main"

[project.urls]
Repository = "https://github.com/smiles724/ProteoCraft_v1"

[tool.setuptools.packages.find]
include = ["proteocraft*"]

[tool.setuptools.package-data]
proteocraft = ["configs/**/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
