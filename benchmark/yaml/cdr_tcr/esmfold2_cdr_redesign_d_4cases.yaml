# ProteoCraft-ESMFold2 D method for the four CDR redesign cases in the
# 59-run benchmark.
#
# Run all four cases serially on one GPU:
#   python benchmark/script/run_esmfold2_cdr_redesign.py \
#     --config benchmark/yaml/cdr_tcr/esmfold2_cdr_redesign_d_4cases.yaml \
#     --device cuda:0
#
# Run one case:
#   python benchmark/script/run_esmfold2_cdr_redesign.py \
#     --config benchmark/yaml/cdr_tcr/esmfold2_cdr_redesign_d_4cases.yaml \
#     --case 9NMW_alpha --device cuda:0
#
# ESMFold2 is sequence-only here. Template paths are retained for case
# provenance and downstream evaluation, but are not consumed by the model.

launch_profile: esmfold2_d
input_dir: benchmark/datasets/proteocraft_59_v1/cdr
output_dir: benchmark/outputs/esmfold2_cdr_redesign_d_seed43
device: cuda
seed: 43

# The formal profile supplies the common two-stage algorithm. Only the CDR
# motif is mutable; framework residues remain fixed.
esmfold2_verifier_num_loops: 4
esmfold2_verifier_num_sampling_steps: 50

cases:
  - id: 9NMW_alpha
    fasta_path: fastas/rcsb_pdb_9NMW_abtrunc.fasta
    template_path: templates/9NMW.cif
    binder_chain: D
    target_chains: [C]
    scaffold_chains: [A, E]
    cdr_motif: CAVNNARLMFGDGTQL

  - id: 9NMW_beta
    fasta_path: fastas/rcsb_pdb_9NMW_abtrunc.fasta
    template_path: templates/9NMW.cif
    binder_chain: E
    target_chains: [C]
    scaffold_chains: [A, D]
    cdr_motif: CASSVAGSPEAFF

  - id: 1QRN_alpha
    fasta_path: fastas/rcsb_pdb_1QRN_abtrunc.fasta
    template_path: templates/1QRN_fixed_template.cif
    binder_chain: D
    target_chains: [C]
    scaffold_chains: [A, E]
    cdr_motif: CAVTTDSWGKLQF

  - id: 1QRN_beta
    fasta_path: fastas/rcsb_pdb_1QRN_abtrunc.fasta
    template_path: templates/1QRN_fixed_template.cif
    binder_chain: E
    target_chains: [C]
    scaffold_chains: [A, D]
    cdr_motif: CASRPGLAGGRPEQYF
