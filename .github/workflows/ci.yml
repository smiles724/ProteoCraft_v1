name: CPU regression and package
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: python -m pytest -q
      - run: python -m build
      - name: Verify installed wheel outside the checkout
        run: |
          python -m venv --system-site-packages /tmp/proteocraft-wheel
          /tmp/proteocraft-wheel/bin/python -m pip install --no-deps dist/*.whl
          cd /tmp
          /tmp/proteocraft-wheel/bin/proteocraft --help
          /tmp/proteocraft-wheel/bin/proteocraft-rescore --help
          /tmp/proteocraft-wheel/bin/python -c "from proteocraft.cli import parse_args_with_profile, resolve_search_defaults; a,p=parse_args_with_profile(['--target','ACDEFGHIK']); resolve_search_defaults(a,p); assert a.n_steps == 110; assert a.esmfold2_stagea_candidate_strategy == 'positive_score_guarded'"
